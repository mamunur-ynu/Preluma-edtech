name: Keep Streamlit app awake

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Preluma app
        run: |
          curl -sSL -o /dev/null -w "status=%{http_code}\n" https://prelumaedtech.streamlit.app/ || true
