# Copy to .streamlit/secrets.toml (local) or paste into Streamlit Cloud → Settings → Secrets.
# NEVER commit the real secrets.toml. Every key below is also accepted as a plain environment variable.

# ── Database ─────────────────────────────────────────────────────────────────
# Default: SQLite file at data/preluma.db (fine for demos; Streamlit Cloud resets it on redeploy).
# Production: a PostgreSQL URL, e.g. Supabase → Project Settings → Database → Connection string.
# DATABASE_URL = "postgresql+psycopg2://user:password@host:5432/postgres"

# ── Accounts & access ────────────────────────────────────────────────────────
# Teachers can self-register only if you set an invite code (no default exists).
PRELUMA_TEACHER_INVITE_CODE = ""
# Comma-separated usernames that get the Admin Panel (must already be registered).
PRELUMA_ADMIN_USERS = ""
# Optional demo accounts for classroom demos — JSON list. Leave empty in production.
# DEMO_USERS_JSON = '[{"username":"demo_student","password":"CHANGE-ME-8chars+","role":"student","full_name":"Demo Student"}]'
# Hours a login stays valid.
# PRELUMA_SESSION_TTL_HOURS = 24
# Keep false in production. This enables the old query/localStorage session bridge only for demos.
PRELUMA_ALLOW_LEGACY_BROWSER_SESSION = false

# ── Optional cloud backup of legacy CSV data / photos (Supabase REST) ────────
SUPABASE_URL = ""
SUPABASE_KEY = ""

# ── AI providers (add any; they are tried in this order, first answer wins) ──
GROQ_API_KEY = ""
CEREBRAS_API_KEY = ""
MISTRAL_API_KEY = ""
OPENROUTER_API_KEY = ""
TOGETHER_API_KEY = ""
OPENAI_API_KEY = ""
ANTHROPIC_API_KEY = ""
GEMINI_API_KEY = ""
# Optional model overrides: GROQ_MODEL, OPENAI_MODEL, ANTHROPIC_MODEL, GEMINI_MODEL, ...

# ── RAG ──────────────────────────────────────────────────────────────────────
# PRELUMA_EMBEDDINGS   = "auto"   # auto | hashing (offline, default fallback) | sentence-transformers
# PRELUMA_VECTOR_STORE = "auto"   # auto | memory | faiss

# ── Runtime safety limits ────────────────────────────────────────────────────
PRELUMA_AI_REQUESTS_PER_MINUTE = 12
PRELUMA_CONVERSATION_RETENTION_DAYS = 30
PRELUMA_LLM_TIMEOUT = 20
PRELUMA_LLM_MAX_TOKENS = 2200
